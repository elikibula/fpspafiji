{% extends "base.html" %}
{% block content %}
<h1>{{ category.name }}</h1>

{% if documents %}
    <ul>
    {% for doc in documents %}
        <li>
            <a href="{{ doc.file.url }}" target="_blank">{{ doc.title }}</a>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No documents available.</p>
{% endif %}
{% endblock %}
