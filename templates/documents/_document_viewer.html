<div class="rounded-2xl border border-slate-200 bg-white shadow-lg overflow-hidden">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-50 border-b border-slate-200 px-5 py-4">
    <div>
      <h1 class="text-xl font-bold text-slate-900">{{ document.title }}</h1>
      <p class="mt-1 text-sm text-slate-500">{{ extension|upper|cut:"." }} document</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <a href="{% url 'documents:document_detail' document.pk %}" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-semibold hover:bg-white">Details</a>
      <a href="{% url 'documents:document_download' document.pk %}" class="px-4 py-2 rounded-lg bg-[#1f5ca8] text-white font-semibold hover:bg-[#0f2f5f]">Download</a>
    </div>
  </div>

  {% if can_embed %}
    <iframe
      src="{% url 'documents:document_inline' document.pk %}"
      title="Preview of {{ document.title }}"
      class="block w-full bg-slate-100"
      style="height: min(78vh, 900px); min-height: 560px;"
    ></iframe>
  {% else %}
    <div class="px-6 py-20 text-center">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-blue-50 text-3xl">&#128196;</div>
      <h2 class="mt-5 text-xl font-bold text-slate-900">Browser preview is not available</h2>
      <p class="mx-auto mt-2 max-w-xl text-slate-600">This file type needs to be opened in its desktop application. Download the document to view it.</p>
      <a href="{% url 'documents:document_download' document.pk %}" class="mt-6 inline-flex px-5 py-2.5 rounded-lg bg-[#1f5ca8] text-white font-semibold hover:bg-[#0f2f5f]">Download {{ document.title }}</a>
    </div>
  {% endif %}
</div>
